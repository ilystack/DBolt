name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and package desktop client
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DBolt ${{ github.ref_name }}
          releaseBody: |
            ### DBolt ${{ github.ref_name }}

            Free, fast, open-source database client with built-in AI Data Studio for 70+ databases.

            #### What's New in this Release

            - **Smart Mock Data Generator (1-Click Seeder)**
              - Generate realistic synthetic test data tailored to table columns and constraints directly from the table context menu or table view toolbar.
              - Built-in generators for names, emails, UUIDs, timestamps, phone numbers, prices, and status enums.
              - 1-click direct batch insertion into database or preview in a new SQL query tab.

            - **Visual Explain Plan & AI Query Optimizer**
              - Interactive execution plan visualizer with automated bottleneck detection (sequential scans, high-cost sorts, stale statistics).
              - Automated Performance Health Score (0-100).
              - 1-click recommended index DDL generation and AI query rewrite prompt builder.

            - **Strict Zero Data Leak Guard & Privacy Architecture**
              - Strict guarantee that production table rows and cell values are never uploaded to AI providers.
              - Context transmission is strictly limited to schema structure and column types.
              - 100% air-gapped local model execution with Ollama or LM Studio on localhost.

            - **UI and UX Refinements**
              - Edge-to-edge chat workspace with dynamic panel resizing and collapsible history drawer.
              - Streamlined borderless chat toolbar and Lucide bot icon.
              - Restructured settings navigation with dedicated Appearance and About tabs.

            #### Download Binaries
            - Windows: `.exe` (NSIS Installer)
            - macOS: `.dmg` (Universal binary for Apple Silicon and Intel)
            - Linux: `.AppImage` and `.deb`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
